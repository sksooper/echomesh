services:
  db:
    image: pgrouting/pgrouting-extra:16-3.5-4.0
    env_file: .env
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # skrypty z tego katalogu uruchamiają się TYLKO przy pierwszym starcie (pusty wolumen)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
